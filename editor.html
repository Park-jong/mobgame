<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cannon Defense 에디터</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #14181e; color: #dde3ea; font: 13px/1.4 sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; background: #1d232c; border-bottom: 1px solid #2c3541; }
    header h1 { font-size: 15px; margin: 0 10px 0 0; }
    #coord { min-width: 150px; font-family: monospace; color: #9fc4ff; }
    #msg { flex: 1; min-width: 200px; color: #aab4c0; }
    #msg.ok { color: #7fe08a; } #msg.err { color: #ff8a8a; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2c3541; color: #9fc4ff; white-space: nowrap; }
    .badge.server { background: #24472b; color: #b8f0c0; } .badge.offline { background: #5a3a12; color: #ffd9a0; }
    #autosave { font-size: 11px; color: #8a95a3; white-space: nowrap; } #autosave.warn { color: #ffd08a; }
    button.primary { background: #3a7bd5; border-color: #6aa3f0; color: #fff; font-weight: bold; }
    button.primary:hover:not(:disabled) { background: #4a8be5; }
    #recover { margin: 0; padding: 6px 10px; background: #1f3a5a; color: #cfe4ff; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #recover[hidden] { display: none; }
    #banner { margin: 0; padding: 6px 10px; background: #5a3a12; color: #ffd9a0; }
    main { flex: 1; display: flex; min-height: 0; }
    #canvasWrap { flex: 1; min-width: 0; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    aside { width: 420px; max-width: 45vw; overflow-y: auto; padding: 8px 12px 40px; background: #1a2028; border-left: 1px solid #2c3541; }
    section { border-bottom: 1px solid #2c3541; padding-bottom: 8px; }
    h3 { font-size: 13px; margin: 10px 0 6px; color: #9fc4ff; }
    h4 { font-size: 12px; margin: 10px 0 4px; color: #b8c2cf; }
    button { background: #2b3644; color: #dde3ea; border: 1px solid #3c4a5c; border-radius: 4px; padding: 3px 9px; cursor: pointer; font: inherit; }
    button:hover:not(:disabled) { background: #354458; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .tab { min-width: 32px; } .tab.cur { background: #3a7bd5; border-color: #6aa3f0; }
    .btnbar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .row { display: flex; gap: 8px; align-items: flex-start; margin: 3px 0; }
    .row .lbl { width: 130px; flex: none; padding-top: 3px; color: #b8c2cf; }
    .row > :last-child { flex: 1; min-width: 0; }
    input[type=text], input[type=number], select, textarea { width: 100%; background: #10141a; color: #dde3ea; border: 1px solid #3c4a5c; border-radius: 3px; padding: 2px 5px; font: inherit; }
    input[type=color] { width: 48px; height: 22px; padding: 0; background: none; border: 1px solid #3c4a5c; }
    .numlist { display: flex; gap: 3px; flex-wrap: wrap; } .numlist input { width: 58px; }
    .bad { border-color: #ff4a4a !important; outline: 1px solid #ff4a4a; }
    .note, .hint { color: #8a95a3; font-size: 12px; margin: 3px 0; }
    .noterow { display: block; }
    .tag { font-size: 11px; font-weight: normal; padding: 1px 6px; border-radius: 8px; background: #3a4a2a; color: #cfe8a8; }
    .lockbox { margin-top: 6px; padding: 6px 8px; background: #3a2a2a; color: #ffc9c9; border-radius: 4px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .lockbox.open { background: #4a3a14; color: #ffe0a0; }
    button.danger { background: #8a3a12; border-color: #e0762a; color: #fff; font-weight: bold; }
    button.danger:hover:not(:disabled) { background: #a84a18; }
    .warnbox { margin-top: 6px; padding: 5px 8px; background: #4a3a14; color: #ffd9a0; border-radius: 4px; }
    .tablewrap { overflow-x: auto; }
    .etable { border-collapse: collapse; } .etable th, .etable td { padding: 2px 3px; text-align: left; font-weight: normal; white-space: nowrap; }
    .etable thead th { color: #b8c2cf; font-size: 11px; } .etable td input[type=number] { width: 62px; } .etable td input[type=text] { width: 70px; }
    .err { color: #ff8a8a; } .wrn { color: #ffd08a; } .ok { color: #7fe08a; }
  </style>
</head>
<body>
  <header>
    <h1>Cannon Defense 에디터</h1>
    <span id="modeBadge" class="badge">환경 확인 중...</span>
    <button id="btnSave" title="Ctrl+S">저장</button>
    <button id="btnUndo" title="Ctrl+Z">되돌리기</button>
    <button id="btnRedo" title="Ctrl+Y">다시</button>
    <button id="btnPlay">플레이 테스트</button>
    <button id="btnClearDraft">임시본 지우기</button>
    <button id="btnDownload">JSON 내려받기</button>
    <button id="btnImport">JSON 불러오기</button>
    <input id="fileInput" type="file" accept=".json,application/json" hidden />
    <span id="coord">x, z: -</span>
    <span id="autosave"></span>
    <span id="msg"></span>
  </header>
  <p id="banner" hidden></p>
  <div id="recover" hidden>
    <span id="recoverText"></span>
    <button id="btnRecover" class="primary">복구</button>
    <button id="btnDiscard">버리기</button>
  </div>
  <main>
    <div id="canvasWrap"><canvas id="canvas"></canvas></div>
    <aside>
      <section id="secStages"></section>
      <section id="secAdd"></section>
      <section id="secSel"></section>
      <section id="secStage"></section>
      <section id="secConfig"></section>
      <section id="secEtypes"></section>
      <section id="secIssues"></section>
    </aside>
  </main>
  <script type="module" src="/src/editor/main.js"></script>
</body>
</html>
